name: Espelhar schema de producao no repositorio

# Por que existe: as migracoes aplicadas direto pelo painel/SQL Editor nunca viravam arquivo aqui.
# O banco tinha 122 migracoes registradas contra 95 arquivos no repositorio, ou seja, o codigo
# versionado nao descrevia mais o banco real — e diferenca nenhuma aparecia em code review.
#
# Este workflow gera supabase/schema_producao.sql (estrutura, RLS, funcoes e triggers; SEM dados)
# e comita se algo mudou. O diff do git passa a mostrar qualquer alteracao de schema, tenha ela
# vindo de um arquivo de migracao ou de um comando avulso no painel.
#
# Nao substitui o backup semanal (que leva dados e arquivos): aqui e so a estrutura, para revisao.

on:
  schedule:
    - cron: '0 7 * * 1' # segunda, 04:00 de Brasilia (depois do backup semanal de domingo)
  workflow_dispatch:

permissions:
  contents: write

env:
  DB_USUARIO: postgres.qfmzgsoindjtqzewgecp
  DB_HOST: aws-1-sa-east-1.pooler.supabase.com
  DB_PORTA: '5432'

jobs:
  espelhar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Preparar conexao
        env:
          SENHA: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          if [ -z "$SENHA" ]; then
            echo "ERRO: o secret SUPABASE_DB_PASSWORD nao esta configurado."
            exit 1
          fi
          SENHA_CODIFICADA=$(node -e 'process.stdout.write(encodeURIComponent(process.env.SENHA))')
          URL="postgresql://${DB_USUARIO}:${SENHA_CODIFICADA}@${DB_HOST}:${DB_PORTA}/postgres"
          echo "::add-mask::$URL"
          echo "DB_URL=$URL" >> "$GITHUB_ENV"

      - name: Exportar estrutura
        run: supabase db dump --db-url "$DB_URL" -f supabase/schema_producao.sql

      - name: Conferir que o dump nao veio vazio
        run: |
          LINHAS=$(wc -l < supabase/schema_producao.sql)
          if [ "$LINHAS" -lt 100 ]; then
            echo "ERRO: dump com apenas $LINHAS linhas — algo deu errado."
            exit 1
          fi
          echo "OK: $LINHAS linhas."

      - name: Comitar se mudou
        # O 'git add' vem ANTES da comparacao de proposito. Antes ele vinha depois, e a checagem
        # era 'git diff --quiet -- <arquivo>' — que ignora arquivo nao rastreado e devolve "nada
        # mudou". Como o schema_producao.sql nunca tinha sido comitado, toda execucao caia no
        # 'exit 0' e o workflow terminava VERDE sem fazer nada: rodou todas as segundas desde
        # 15/08/2026 e nunca criou a primeira versao do arquivo. Comparando o indice
        # (--cached) depois do add, o caso "arquivo novo" tambem conta como mudanca.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/schema_producao.sql
          if git diff --cached --quiet -- supabase/schema_producao.sql; then
            echo "Schema sem alteracoes desde a ultima execucao."
            exit 0
          fi
          git commit -m "Espelha schema de producao [skip ci]"
          git push
