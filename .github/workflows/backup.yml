name: Backup semanal (banco + arquivos)

# Roda todo domingo as 03:00 (horario de Brasilia) e tambem sob demanda,
# pelo botao "Run workflow" na aba Actions.
on:
  schedule:
    - cron: '0 6 * * 0'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Baixar o repositorio
        uses: actions/checkout@v4

      - name: Instalar o Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Preparar pasta de destino
        run: mkdir -p backup

      # ---------- BANCO DE DADOS ----------
      # Tres arquivos separados, porque restaurar exige aplicar nesta ordem:
      # 1) estrutura das tabelas  2) dados  3) policies, funcoes e triggers
      - name: Exportar estrutura do banco
        run: supabase db dump --db-url "${{ secrets.SUPABASE_DB_URL }}" -f backup/01-estrutura.sql

      - name: Exportar dados
        run: supabase db dump --db-url "${{ secrets.SUPABASE_DB_URL }}" --data-only -f backup/02-dados.sql

      - name: Exportar policies, funcoes e permissoes
        run: supabase db dump --db-url "${{ secrets.SUPABASE_DB_URL }}" --role-only -f backup/03-papeis.sql || echo "sem papeis customizados"

      # ---------- ARQUIVOS DO STORAGE ----------
      # O backup nativo do Supabase NAO cobre os arquivos. Por isso este passo existe.
      - name: Baixar arquivos do Storage
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/backup-storage.mjs backup/arquivos

      # ---------- CONFERENCIA ----------
      - name: Resumo do backup
        run: |
          echo "===== CONTEUDO DO BACKUP ====="
          ls -lh backup/
          echo
          echo "Tamanho total:"
          du -sh backup/
          echo
          echo "Linhas em cada dump:"
          wc -l backup/*.sql
          echo
          echo "===== VERIFICACAO ====="
          # Falha o workflow se o dump de dados vier vazio ou suspeito
          if [ ! -s backup/02-dados.sql ]; then
            echo "ERRO: o dump de dados esta vazio."
            exit 1
          fi
          LINHAS=$(wc -l < backup/02-dados.sql)
          if [ "$LINHAS" -lt 50 ]; then
            echo "ERRO: o dump de dados tem apenas $LINHAS linhas. Algo esta errado."
            exit 1
          fi
          echo "OK: dump de dados com $LINHAS linhas."

      - name: Guardar o backup
        uses: actions/upload-artifact@v4
        with:
          name: backup-strategya-${{ github.run_number }}
          path: backup/
          retention-days: 90
          compression-level: 9
