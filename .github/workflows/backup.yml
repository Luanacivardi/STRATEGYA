name: Backup semanal (banco + arquivos)

# Roda todo domingo as 03:00 (horario de Brasilia) e tambem sob demanda,
# pelo botao "Run workflow" na aba Actions.
#
# Usa apenas DOIS secrets:
#   SUPABASE_DB_PASSWORD      -> so a senha do banco, nada mais
#   SUPABASE_SERVICE_ROLE_KEY -> a chave service_role
#
# O usuario, o host, a porta e a URL do projeto ficam fixos aqui embaixo porque
# nao sao segredo (a URL ja e publica no config.js do app). Deixar fixo elimina
# a maior fonte de erro: montar string de conexao a mao.
#
# O backup final (zip com estrutura+dados+papeis+arquivos) vai pro bucket
# PRIVADO 'backups' no Supabase Storage — NUNCA pra actions/upload-artifact,
# porque este repositorio e publico e artifacts publicos podem ser baixados
# por qualquer conta do GitHub.
on:
  schedule:
    - cron: '0 6 * * 0'
  workflow_dispatch:

env:
  PROJETO_URL: https://qfmzgsoindjtqzewgecp.supabase.co
  DB_USUARIO: postgres.qfmzgsoindjtqzewgecp
  DB_HOST: aws-1-sa-east-1.pooler.supabase.com
  DB_PORTA: '5432'

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Baixar o repositorio
        uses: actions/checkout@v4

      - name: Instalar o Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      # Monta a URL de conexao aqui dentro. Caracteres especiais na senha
      # (/ @ # : ?) sao codificados automaticamente, em vez de quebrarem a URL.
      - name: Preparar conexao
        env:
          SENHA: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          if [ -z "$SENHA" ]; then
            echo "ERRO: o secret SUPABASE_DB_PASSWORD nao esta configurado."
            echo "Crie em Settings > Secrets and variables > Actions."
            exit 1
          fi
          SENHA_CODIFICADA=$(node -e 'process.stdout.write(encodeURIComponent(process.env.SENHA))')
          URL="postgresql://${DB_USUARIO}:${SENHA_CODIFICADA}@${DB_HOST}:${DB_PORTA}/postgres"
          echo "::add-mask::$URL"
          echo "DB_URL=$URL" >> "$GITHUB_ENV"
          echo "Conexao montada: ${DB_USUARIO}@${DB_HOST}:${DB_PORTA}"
          mkdir -p backup

      # ---------- BANCO DE DADOS ----------
      # Tres arquivos separados, porque restaurar exige aplicar nesta ordem:
      # 1) estrutura das tabelas  2) dados  3) papeis e permissoes
      - name: Exportar estrutura do banco
        run: supabase db dump --db-url "$DB_URL" -f backup/01-estrutura.sql

      - name: Exportar dados
        run: supabase db dump --db-url "$DB_URL" --data-only -f backup/02-dados.sql

      - name: Exportar papeis e permissoes
        run: supabase db dump --db-url "$DB_URL" --role-only -f backup/03-papeis.sql || echo "sem papeis customizados"

      # ---------- ARQUIVOS DO STORAGE ----------
      # O backup nativo do Supabase NAO cobre os arquivos. Por isso este passo existe.
      - name: Baixar arquivos do Storage
        env:
          SUPABASE_URL: ${{ env.PROJETO_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/backup-storage.mjs backup/arquivos

      # ---------- CONFERENCIA ----------
      - name: Resumo do backup
        run: |
          echo "===== CONTEUDO DO BACKUP ====="
          ls -lh backup/
          echo
          echo "Tamanho total:"
          du -sh backup/
          echo
          echo "Linhas em cada dump:"
          wc -l backup/*.sql
          echo
          echo "===== VERIFICACAO ====="
          if [ ! -s backup/02-dados.sql ]; then
            echo "ERRO: o dump de dados esta vazio."
            exit 1
          fi
          LINHAS=$(wc -l < backup/02-dados.sql)
          if [ "$LINHAS" -lt 50 ]; then
            echo "ERRO: o dump de dados tem apenas $LINHAS linhas. Algo esta errado."
            exit 1
          fi
          echo "OK: dump de dados com $LINHAS linhas."

      # ---------- ENVIO ----------
      # NAO usamos actions/upload-artifact: o repositorio e publico, e artifacts
      # de repositorio publico podem ser baixados por qualquer conta do GitHub.
      # O backup completo (dados de colaboradores, apuracoes de compliance,
      # documentos) vai direto pro bucket PRIVADO 'backups' no Supabase Storage,
      # que so a service_role consegue ler.
      - name: Compactar backup
        id: compactar
        run: |
          DATA=$(date -u +%Y-%m-%d)
          NOME="strategya-backup-semanal-${DATA}.zip"
          (cd backup && zip -rq "../${NOME}" .)
          echo "nome=${NOME}" >> "$GITHUB_OUTPUT"

      - name: Enviar para o Supabase Storage
        env:
          CHAVE: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NOME: ${{ steps.compactar.outputs.nome }}
        run: |
          RESP=$(curl -sS -w '\n%{http_code}' \
            -X POST "${PROJETO_URL}/storage/v1/object/backups/semanal/${NOME}" \
            -H "Authorization: Bearer ${CHAVE}" \
            -H "apikey: ${CHAVE}" \
            -H "Content-Type: application/zip" \
            -H "x-upsert: true" \
            --data-binary "@${NOME}")
          STATUS=$(echo "$RESP" | tail -n1)
          echo "$RESP" | head -n -1
          if [ "$STATUS" -ge 300 ]; then
            echo "ERRO: upload do backup falhou (status $STATUS)."
            exit 1
          fi
          echo "OK: ${NOME} enviado para backups/semanal/."

      # Mantem so os ultimos 8 backups semanais (~2 meses) no bucket.
      - name: Limpar backups semanais antigos
        env:
          CHAVE: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          LISTA=$(curl -sS -X POST "${PROJETO_URL}/storage/v1/object/list/backups" \
            -H "Authorization: Bearer ${CHAVE}" \
            -H "apikey: ${CHAVE}" \
            -H "Content-Type: application/json" \
            -d '{"prefix":"semanal/","limit":1000,"sortBy":{"column":"name","order":"asc"}}')
          ANTIGOS=$(echo "$LISTA" | jq -r '[.[].name] | .[0:-8][]' 2>/dev/null || true)
          if [ -n "$ANTIGOS" ]; then
            PREFIXOS=$(echo "$ANTIGOS" | sed 's#^#semanal/#' | jq -R -s -c 'split("\n")[:-1]')
            curl -sS -X DELETE "${PROJETO_URL}/storage/v1/object/backups" \
              -H "Authorization: Bearer ${CHAVE}" \
              -H "apikey: ${CHAVE}" \
              -H "Content-Type: application/json" \
              -d "{\"prefixes\": ${PREFIXOS}}"
            echo "Removidos: $ANTIGOS"
          else
            echo "Nada a remover."
          fi
