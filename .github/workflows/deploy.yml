name: Build e deploy (ofuscado)

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install

      # Antes de publicar: confere se os literais de modulo/submodulo do JS batem com o catalogo
      # no banco. Um literal digitado errado nao quebra nada visivelmente — so faz uma permissao
      # parar de valer, em silencio. Sem segredo: o catalogo e legivel pelo papel public.
      - name: Conferir catalogo de modulos
        run: node scripts/conferir-catalogo-modulos.mjs

      # Os modulos agora sao buscados sob demanda (import dinamico no app.js). Um nome errado
      # deixou de quebrar na hora e passou a falhar so quando alguem clica naquele modulo — este
      # passo devolve a falha para o build.
      - name: Conferir modulos sob demanda
        run: node scripts/conferir-modulos-carregaveis.mjs

      - run: npm run build
      - name: Publica dist/ na branch gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
